[project]
name = "repo2nb-core"
version = "0.1.0"
description = "Pure-Python engine: scan a project's files and generate a Kaggle/Colab-ready notebook"
requires-python = ">=3.11"
dependencies = ["pathspec>=0.12"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo2nb_core"]

[tool.ruff]
line-length = 100
exclude = ["_vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
